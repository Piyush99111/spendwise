<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment academy · SpendWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arapey:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/academy.css">
</head>
<body data-page="academy" data-title="Investment academy" data-sub="Short modules on tax and investing. Earn XP and keep your streak." data-section="ACADEMIC PROGRESSION">
<main id="content" class="grid g2">
<section class="card"><div class="head"><h2>Curriculum</h2><div class="tabs" id="tabs" role="group" aria-label="Filter modules"></div></div><div id="mods"></div>
<p class="muted academy-s1">Free reading: <a href="https://zerodha.com/varsity/" target="_blank" rel="noopener">Zerodha Varsity</a> (open access, no sign-up).</p></section>
<div class="grid"><section class="card dark"><p class="label">Study streak</p><p class="big" id="xp"></p><div class="bar" aria-hidden="true"><i class="c" id="xpb"></i></div><p class="academy-s2" id="lvl"></p></section>
<section class="card"><h2 class="academy-s3">Add a lesson video</h2><form id="vf" novalidate><div class="form-msg" role="alert"></div><div class="field"><label for="vm">Module</label><select id="vm" name="module"></select><span class="err" role="alert"></span></div><div class="field"><label for="vt">Video title</label><input id="vt" name="title" maxlength="60"><span class="err" role="alert"></span></div><div class="field"><label for="vu">YouTube link</label><input id="vu" name="url" placeholder="https://www.youtube.com/watch?v=..."><span class="err" role="alert"></span></div><button class="btn" type="submit">Add video</button></form></section>
<section class="card"><h2 class="academy-s4">Badges</h2><div id="badges"></div></section></div></main>
<dialog id="qd" aria-labelledby="qt"><form method="dialog" id="qf"><h2 class="academy-s3" id="qt"></h2><div id="qb"></div><div class="form-msg" id="qm" role="alert"></div><div class="academy-s5"><button class="btn ghost sm" value="x" id="qx" type="button">Close</button><button class="btn sm" id="qs" type="button">Submit answers</button></div></form></dialog>
<script src="js/store.js"></script><script src="js/validate.js"></script><script src="js/shell.js"></script>
<script src="js/academy.js"></script>
</body></html>
