<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · SpendWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arapey:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-page="dashboard" data-title="Portfolio overview" data-sub="Fiscal year 2026-27 · verified financial ledger" data-section="SMART WEALTH">
<main id="content" class="grid g2">
  <div class="grid">
    <section class="card dark" aria-labelledby="cap">
      <p class="label" id="cap">Available liquid capital</p>
      <p class="big" id="liquid"></p>
      <p class="dashboard-s1" id="today"></p>
      <div class="bar dashboard-s2" aria-hidden="true"><i class="c" id="capbar"></i></div>
      <p class="dashboard-s3" id="capnote"></p>
    </section>
    <section class="card" aria-labelledby="flow">
      <div class="head"><h2 id="flow">Weekly discretionary flow</h2>
        <div class="tabs" role="group" aria-label="Chart mode"><button class="tab" data-mode="out" aria-pressed="true">Outflows</button><button class="tab" data-mode="save" aria-pressed="false">Savings</button></div></div>
      <div class="chart" id="chart" role="img" aria-label="Bar chart of the last seven days"></div>
    </section>
    <section class="card" aria-labelledby="gt"><h2 class="dashboard-s4" id="gt">Budget goals</h2>
      <div class="grid g2 dashboard-s5">
      <form id="gf" novalidate><div class="form-msg" role="alert"></div><div class="field"><label for="wc">Weekly spending cap (₹)</label><input id="wc" name="weeklyCap" type="number" min="1" step="any"><span class="err" role="alert"></span></div><div class="field"><label for="gn">Savings goal name</label><input id="gn" name="saveName" placeholder="e.g. Laptop"><span class="err" role="alert"></span></div><div class="field"><label for="gtg">Goal target (₹)</label><input id="gtg" name="saveTarget" type="number" min="1" step="any"><span class="err" role="alert"></span></div><button class="btn" type="submit">Save goals</button></form>
      <div><p class="label">Savings goal</p><p class="big dashboard-s6" id="gsaved"></p><div class="bar"><i id="gbar"></i></div><p id="gnote" class="muted dashboard-s7"></p>
      <form id="af" novalidate><div class="form-msg" role="alert"></div><div class="field"><label for="ga">Add to goal (₹)</label><input id="ga" name="amount" type="number" min="1" step="any"><span class="err" role="alert"></span></div><button class="btn ghost" type="submit">Move to goal</button></form></div></div></section>
  </div>
  <div class="grid">
    <section class="card" aria-labelledby="pi"><h2 class="dashboard-s8" id="pi">Portfolio instruments</h2><div id="inst"></div></section>
    <section class="card dark" aria-labelledby="adv"><p class="label">Autonomous portfolio advisory</p><h3 class="dashboard-s9" id="adv">Where to route your surplus</h3><p class="dashboard-s10" id="advtext"></p><a class="btn sm dashboard-s11" href="investment.html">Open the sandbox</a></section>
  </div>
</main>
<script src="js/store.js"></script><script src="js/validate.js"></script><script src="js/shell.js"></script>
<script src="js/dashboard.js"></script>
</body></html>
